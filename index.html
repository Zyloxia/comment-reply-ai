<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Comment Reply AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0F1117;
    --surface: #171A21;
    --surface-2: #1E222B;
    --line: #2A2F3A;
    --text: #EDEEF2;
    --muted: #8B909C;
    --pink: #E8608A;
    --violet: #6C5CE7;
    --gold: #F2C265;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(232,96,138,0.14), transparent 60%),
      radial-gradient(1000px 500px at 100% 10%, rgba(108,92,231,0.12), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Inter', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
  }
  .wrap{
    width:100%;
    max-width:640px;
  }
  .eyebrow{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:14px;
  }
  .eyebrow .dot{
    width:6px;height:6px;border-radius:50%;
    background:linear-gradient(135deg, var(--pink), var(--violet));
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(28px, 5vw, 38px);
    line-height:1.15;
    margin:0 0 8px;
  }
  .sub{
    color:var(--muted);
    font-size:15px;
    line-height:1.5;
    margin:0 0 32px;
    max-width:46ch;
  }
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:16px;
    padding:24px;
  }
  label{
    display:block;
    font-size:13px;
    font-weight:600;
    color:var(--muted);
    margin-bottom:8px;
  }
  .field{margin-bottom:18px;}
  textarea{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:10px;
    color:var(--text);
    font-family:'Inter', sans-serif;
    font-size:14.5px;
    padding:12px 14px;
    resize:vertical;
    min-height:60px;
    transition:border-color .15s ease;
  }
  textarea:focus{
    outline:none;
    border-color:var(--pink);
  }
  textarea#comment{min-height:80px;}
  button{
    width:100%;
    border:none;
    border-radius:10px;
    padding:13px 16px;
    font-family:'Inter', sans-serif;
    font-size:15px;
    font-weight:600;
    color:#fff;
    background:linear-gradient(135deg, var(--pink), var(--violet));
    cursor:pointer;
    transition:opacity .15s ease, transform .1s ease;
  }
  button:hover{opacity:0.92;}
  button:active{transform:scale(0.99);}
  button:disabled{opacity:0.6; cursor:not-allowed;}
  .result{
    margin-top:20px;
    padding-top:20px;
    border-top:1px dashed var(--line);
    display:none;
  }
  .result.show{display:block;}
  .bubble-label{
    font-size:12px;
    color:var(--gold);
    font-weight:600;
    letter-spacing:0.04em;
    text-transform:uppercase;
    margin-bottom:10px;
  }
  .bubble{
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:14px;
    border-top-left-radius:4px;
    padding:14px 16px;
    font-size:15px;
    line-height:1.55;
    white-space:pre-wrap;
  }
  .error{
    color:var(--pink);
    font-size:13.5px;
    margin-top:14px;
    display:none;
  }
  .error.show{display:block;}
  footer{
    margin-top:22px;
    text-align:center;
    color:var(--muted);
    font-size:12.5px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow"><span class="dot"></span> Prototype</div>
    <h1>Comment Reply AI</h1>
    <p class="sub">Pakistani small businesses ke liye — Instagram comment daalo, AI ek natural, tone-matched reply likh degi.</p>

    <div class="card">
      <div class="field">
        <label for="postContext">Post ka context (optional)</label>
        <textarea id="postContext" placeholder="Jaise: Naye kurta collection ki launch post..."></textarea>
      </div>
      <div class="field">
        <label for="comment">Comment</label>
        <textarea id="comment" placeholder="Jo comment aaya hai wo yahan type karo..."></textarea>
      </div>
      <button id="generateBtn">Reply Generate Karo</button>

      <div class="error" id="errorBox"></div>

      <div class="result" id="resultBox">
        <div class="bubble-label">AI Reply</div>
        <div class="bubble" id="replyText"></div>
      </div>
    </div>

    <footer>Built by Zyloxia — Gemini API se powered</footer>
  </div>

<script>
  const btn = document.getElementById('generateBtn');
  const commentEl = document.getElementById('comment');
  const contextEl = document.getElementById('postContext');
  const resultBox = document.getElementById('resultBox');
  const replyText = document.getElementById('replyText');
  const errorBox = document.getElementById('errorBox');

  btn.addEventListener('click', async () => {
    const comment = commentEl.value.trim();
    const postContext = contextEl.value.trim();

    errorBox.classList.remove('show');
    resultBox.classList.remove('show');

    if (!comment) {
      errorBox.textContent = 'Pehle koi comment likho.';
      errorBox.classList.add('show');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Generate ho raha hai...';

    try {
      const res = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ comment, postContext })
      });
      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.error || 'Kuch ghalat ho gaya.');
      }

      replyText.textContent = data.reply;
      resultBox.classList.add('show');
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.classList.add('show');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Reply Generate Karo';
    }
  });
</script>
</body>
</html>
